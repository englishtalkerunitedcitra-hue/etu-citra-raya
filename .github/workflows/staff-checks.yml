name: Staff area checks
on:
  pull_request:
    paths:
      - "staff/**"
      - "supabase/**"
      - "tests/staff*"
      - "package*.json"
      - "scripts/configure-staff.mjs"
      - ".github/workflows/staff-checks.yml"
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build:staff
      - run: git diff --exit-code -- staff/app.bundle.js
      - run: npm audit --audit-level=high
